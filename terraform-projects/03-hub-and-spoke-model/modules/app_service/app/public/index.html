<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Go App - Upload</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { border: 1px solid #ccc; padding: 20px; max-width: 400px; border-radius: 8px; }
        input, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
        #status { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<h2>User Profile Upload</h2>

<div class="card">
    <input type="text" id="username" placeholder="Username">
    <input type="email" id="email" placeholder="Email">
    <input type="number" id="age" placeholder="Age">

    <label>Profile Picture:</label>
    <input type="file" id="fileInput">

    <button onclick="uploadUser()">Submit</button>
</div>

<div id="status"></div>

<script src="app.js"></script>

</body>
</html>
